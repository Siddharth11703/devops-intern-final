worker_processes 1;
events { worker_connections 1024; }
http {
    server {
        listen 8080;
        
        # Serve the website
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Healthcheck endpoint required by the rubric
        location /healthz {
            access_log off;
            return 200 "OK";
        }
    }
}